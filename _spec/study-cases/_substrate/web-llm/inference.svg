p)" height="52.5938" rx="6" ry="6" style="stroke:#00BAC6;stroke-width:0.5;" width="104.6494" x="418" y="635.7813"/><text fill="#FAFAFA" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="43.4834" x="448.583" y="658.7764">&#171;app&#187;</text><text fill="#FAFAFA" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.6494" x="428" y="675.0732">Detokenizer</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="21" id="ent0013"><path d="M6,626.7813 L6,697.3125 A0,0 0 0 0 6,697.3125 L344.8525,697.3125 A0,0 0 0 0 344.8525,697.3125 L344.8525,636.7813 L334.8525,626.7813 L179.5,626.7813 L175.5,549.9113 L171.5,626.7813 L6,626.7813 A0,0 0 0 0 6,626.7813" fill="#E5E4E4" filter="url(#fsq0b3ijqmump)" style="stroke:#B4B3B3;stroke-width:0.5;"/><path d="M334.8525,626.7813 L334.8525,636.7813 L344.8525,636.7813 L334.8525,626.7813" fill="#E5E4E4" style="stroke:#B4B3B3;stroke-width:0.5;"/><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.5459" x="36.3083" y="643.8481">Two-phase transformer inference:</text><text fill="#181818" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="43.5576" x="261.9866" y="643.8481">prefill</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.8525" x="12" y="658.981">processes the whole prompt in one pass and fills</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.8955" x="12.9807" y="674.1138">the KV cache;</text><text fill="#181818" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="52.8823" x="107.0085" y="674.1138">decode</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.8486" x="164.0232" y="674.1138">then emits one token per</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.3379" x="24.2573" y="689.2466">step, reusing that cache. WebGPU runs both.</text></g><!--link User to Tokenizer--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="13" id="lnk6"><path d="M424.47,99.4212 C407.18,110.8713 380.62,131.7213 369.5,157.7813 C363.27,172.3713 362.9679,185.2094 364.9679,199.5194" fill="none" id="User-to-Tokenizer" style="stroke:#585858;stroke-width:2;"/><polygon fill="#585858" points="365.66,204.4713,368.3757,195.0042,364.9679,199.5194,360.4528,196.1116,365.66,204.4713" style="stroke:#585858;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.7759" x="370.5" y="170.8481">Raw Text Prompt</text></g><!--link Tokenizer to Prefill--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="14" id="lnk7"><path d="M369.43,257.8613 C367.68,279.5613 365.541,305.8674 363.631,329.6074" fill="none" id="Tokenizer-to-Prefill" style="stroke:#585858;stroke-width:2;"/><polygon fill="#585858" points="363.23,334.5913,367.9389,325.941,363.631,329.6074,359.9646,325.2995,363.23,334.5913" style="stroke:#585858;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.4097" x="367.5" y="300.8481">Token IDs</text></g><!--link Prefill to Decode--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="15" id="lnk8"><path d="M317.13,404.0413 C287.44,427.1513 252.1758,454.6003 222.5458,477.6603" fill="none" id="Prefill-to-Decode" style="stroke:#585858;stroke-width:2;"/><polygon fill="#585858" points="218.6,480.7313,228.1592,478.3603,222.5458,477.6603,223.2458,472.047,218.6,480.7313" style="stroke:#585858;stroke-width:2;stroke-linejoin:miter;str
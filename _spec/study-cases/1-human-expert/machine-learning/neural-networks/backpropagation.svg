t-size="14" lengthAdjust="spacing" textLength="152.9746" x="286.1289" y="528.8701">compare &#375; to target y</text></g><!--entity BACK--><g class="entity" data-qualified-name="BACK" data-source-line="11" id="ent0005"><rect fill="#CBDB2A" filter="url(#f182woxmnwz9af)" height="68.8906" rx="6" ry="6" style="stroke:#818D00;stroke-width:0.5;" width="177.165" x="265.1289" y="634.2813"/><text fill="#181818" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="57.8594" x="324.7817" y="657.2764">&#171;async&#187;</text><text fill="#181818" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.1641" x="301.1294" y="673.5732">Backward pass</text><text fill="#181818" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.165" x="275.1289" y="689.8701">&#8706;Loss/&#8706;w by chain rule</text></g><!--entity W--><g class="entity" data-qualified-name="W" data-source-line="12" id="ent0006"><path d="M473.6289,835.7813 C473.6289,825.7813 527.5874,825.7813 527.5874,825.7813 C527.5874,825.7813 581.5459,825.7813 581.5459,835.7813 L581.5459,893.6719 C581.5459,903.6719 527.5874,903.6719 527.5874,903.6719 C527.5874,903.6719 473.6289,903.6719 473.6289,893.6719 L473.6289,835.7813" fill="#E5E4E4" filter="url(#f182woxmnwz9af)" style="stroke:#585858;stroke-width:0.5;"/><path d="M473.6289,835.7813 C473.6289,845.7813 527.5874,845.7813 527.5874,845.7813 C527.5874,845.7813 581.5459,845.7813 581.5459,835.7813" fill="none" style="stroke:#585858;stroke-width:0.5;"/><text fill="#181818" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="34.9043" x="510.1353" y="862.7764">&#171;db&#187;</text><text fill="#181818" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.7891" x="491.1929" y="879.0732">Weights w</text><text fill="#181818" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.917" x="483.6289" y="895.3701">shared state</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="22" id="ent0014"><path d="M86.6289,780.2813 L86.6289,949.6094 L438.4307,949.6094 L438.4307,790.2813 L428.4307,780.2813 L86.6289,780.2813" fill="#E5E4E4" filter="url(#f182woxmnwz9af)" style="stroke:#B4B3B3;stroke-width:0.5;"/><path d="M428.4307,780.2813 L428.4307,790.2813 L438.4307,790.2813 L428.4307,780.2813" fill="#E5E4E4" style="stroke:#B4B3B3;stroke-width:1;"/><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.6147" x="102.509" y="797.3481">The contribution is</text><text fill="#181818" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="180.9146" x="228.2561" y="797.3481">cheap credit assignment</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.3799" x="409.1707" y="797.3481">:</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.6089" x="106.2954" y="812.481">one backward sweep yields &#8706;Loss/&#8706;w for</text><text fill="#181818" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="36.7275" x="373.0366" y="812.481">every</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="308.2803" x="103.8896" y="827.6138">weight at roughly the cost of one forward pass,</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.6538" x="101.7029" y="842.7466">by reusing each layer's intermediate derivative.</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.8018" x="92.6289" y="857.8794">That is why hidden layers became trainable &#8212; and</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.4653" x="131.7971" y="873.0122">why "hidden units learn useful internal</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.3677" x="113.8459" y="888.145">representations" is the paper's actual claim.</text><line style="stroke:#B4B3B3;stroke-width:1;" x1="87.6289" x2="437.4307" y1="891.2109" y2="891.2109"/><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.9219" x="102.3472" y="907.2778">Backprop produces the</text><text fill="#181818" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="98.1792" x="257.4014" y="907.2778">gradient only</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="58.1318" x="355.5806" y="907.2778">. Turning</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.9985" x="118.5305" y="922.4106">a gradient into a step is a separate choice:</text><text fill="#181818" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="289.5864" x="111.1704" y="937.5435">../optimization/gradient-descent.puml</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="400.7568" y="937.5435">.</text></g><!--link IN to HID--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="14" id="lnk7"><path d="M473.6289,120.5412 C473.6289,143.6513 473.6289,169.1713 473.6289,192.2313" fill="none" id="IN-to-HID" style="stroke:#585858;stroke-width:2;"/><polygon fill="#585858" points="473.6289,197.2313,477.6289,188.2313,473.6289,192.2313,469.6289,188.2313,473.6289,197.2313" style="stroke:#585858;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.9668" x="474.6289" y="163.3481">forward pass</text></g><!--link HID to OUT--><g class="link" data-entity-1="ent0002" data-e
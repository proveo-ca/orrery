-source-line="8" id="ent0002"><rect fill="#005F7F" filter="url(#ftybk5qfm9otu)" height="68.8906" rx="6" ry="6" style="stroke:#00BAC6;stroke-width:0.5;" width="173.0703" x="54.1318" y="235.7813"/><text fill="#FAFAFA" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="43.4834" x="118.9253" y="258.7764">&#171;app&#187;</text><text fill="#FAFAFA" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.7295" x="69.8022" y="275.0732">Temporal difference</text><text fill="#FAFAFA" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.0703" x="64.1318" y="291.3701">learn a value function</text></g><!--entity Q--><g class="entity" data-qualified-name="Q" data-source-line="9" id="ent0003"><rect fill="#005F7F" filter="url(#ftybk5qfm9otu)" height="68.8906" rx="6" ry="6" style="stroke:#00BAC6;stroke-width:0.5;" width="226.8281" x="36.1318" y="433.7813"/><text fill="#FAFAFA" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="43.4834" x="127.8042" y="456.7764">&#171;app&#187;</text><text fill="#FAFAFA" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.4316" x="112.8301" y="473.0732">Q-learning</text><text fill="#FAFAFA" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="206.8281" x="46.1318" y="489.3701">learn action values, off-policy</text></g><!--entity PG--><g class="entity" data-qualified-name="PG" data-source-line="10" id="ent0004"><rect fill="#E9F4F7" filter="url(#ftybk5qfm9otu)" height="68.8906" rx="6" ry="6" style="stroke:#005F7F;stroke-width:0.5;" width="210.3672" x="213.6318" y="334.7813"/><text fill="#005F7F" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="47.3525" x="295.1392" y="357.7764">&#171;host&#187;</text><text fill="#005F7F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.1934" x="266.7188" y="374.0732">Policy gradient</text><text fill="#005F7F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.3672" x="223.6318" y="390.3701">optimize the policy directly</text></g><!--entity BC--><g class="entity" data-qualified-name="BC" data-source-line="11" id="ent0005"><rect fill="#CBDB2A" filter="url(#ftybk5qfm9otu)" height="68.8906" rx="6" ry="6" style="stroke:#818D00;stroke-width:0.5;" width="194.624" x="451.1318" y="334.7813"/><text fill="#181818" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="57.8594" x="519.5142" y="357.7764">&#171;async&#187;</text><text fill="#181818" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.1641" x="485.3618" y="374.0732">Behaviour cloning</text><text fill="#181818" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.624" x="461.1318" y="390.3701">imitate an existing script</text></g><!--entity POL--><g class="entity" data-qualified-name="POL" data-source-line="12" id="ent0006"><path d="M257.6318,573.7813 C257.6318,563.7813 318.3887,563.7813 318.3887,563.7813 C318.3887,563.7813 379.1455,563.7813 379.1455,573.7813 L379.1455,631.6719 C379.1455,641.6719 318.3887,641.6719 318.3887,641.6719 C318.3887,641.6719 257.6318,641.6719 257.6318,631.6719 L257.6318,573.7813" fill="#E5E4E4" filter="url(#ftybk5qfm9otu)" style="stroke:#585858;stroke-width:0.5;"/><path d="M257.6318,573.7813 C257.6318,583.7813 318.3887,583.7813 318.3887,583.7813 C318.3887,583.7813 379.1455,583.7813 379.1455,573.7813" fill="none" style="stroke:#585858;stroke-width:0.5;"/><text fill="#181818" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="34.9043" x="300.9365" y="600.7764">&#171;db&#187;</text><text fill="#181818" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.7695" x="298.0039" y="617.0732">Policy</text><text fill="#181818" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="101.5137" x="267.6318" y="633.3701">state to action</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="23" id="ent0015"><path d="M6.1318,702.7813 L6.1318,925.5078 A0,0 0 0 0 6.1318,925.5078 L631.2002,925.5078 A0,0 0 0 0 631.2002,925.5078 L631.2002,712.7813 L621.2002,702.7813 L322.6318,702.7813 L318.6318,642.2113 L314.6318,702.7813 L6.1318,702.7813 A0,0 0 0 0 6.1318,702.7813" fill="#E5E4E4" filter="url(#ftybk5qfm9otu)" style="stroke:#B4B3B3;stroke-width:0.5;"/><path d="M621.2002,702.7813 L621.2002,712.7813 L631.2002,712.7813 L621.2002,702.7813" fill="#E5E4E4" style="stroke:#B4B3B3;stroke-width:0.5;"/><text fill="#181818" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="297.5654" x="138.8279" y="719.8481">The problem RL solves is delayed credit:</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.9785" x="440.5256" y="719.8481">a game</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.5879" x="139.8721" y="734.981">won in 60 moves gives one number, and TD's answer</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.2954" x="152.0183" y="750.1138">is to bootstrap &#8212; predict from the next prediction</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="5.0718" x="177.8882" y="765.2466">(</text><text fill="#181818" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="258.2798" x="182.96" y="765.2466">temporal-difference-learning.puml</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="9.2041" x="441.2397" y="765.2466">).</text><line style="stroke:#B4B3B3;stroke-width:1;" x1="7.1318" x2="630.2002" y1="768.3125" y2="768.3125"/><text fill="#181818" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="229.8232" x="158.6294" y="784.3794">Start by cloning, not exploring.</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="77.1177" x="392.585" y="784.3794">If a scripted</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.2256" x="165.0532" y="799.5122">heuristic already plays adequately, behaviour</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.0688" x="162.6316" y="814.645">cloning gives a warm start for a fraction of the</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.4829" x="152.4246" y="829.7778">self-play budget, and the script remains available</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.1406" x="225.0957" y="844.9106">as an explainer afterwards.</text><line style="stroke:#B4B3B3;stroke-width:1;" x1="7.1318" x2="630.2002" y1="851.9766" y2="851.9766"/><text fill="#181818" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="93.5771" x="149.457" y="868.0435">Ladder note.</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.7085" x="247.1665" y="868.0435">These primers are Level 1. Running</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.6069" x="146.3625" y="883.1763">a reward loop against a pretrained model's weights</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.5967" x="38.0017" y="898.3091">is Level 6 &#8212;</text><text fill="#181818" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="469.5996" x="120.7307" y="898.3091">_spec/study-cases/6-post-training/rl-verifiable-rewards.puml</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.4575" x="12.1318" y="913.4419">and</text><text fill="#181818" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="571.3462" x="40.7217" y="913.4419">_spec/study-cases/6-post-training/reinforcement-fine-tuning-pipeline.puml</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="612.0679" y="913.4419">.</text></g><!--link H to BC--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" data-link-type="dependency" data-source-line="14" id="lnk7"><path d="M382.0518,102.6812 C430.7418,110.0412 495.4218,128.3513 530.6318,173.7813 C566.4718,220.0113 562.9554,287.3115 556.3454,329.5215" fill="none" id="H-to-BC" style="stroke:#585858;stroke-width:1;stroke-dasharray:1,3;"/><polygon fill="#585858" points="555.5718,334.4612,560.9161,326.1885,556.3454,329.5215,553.0124,324.9508,555.5718,334.4612" style="stroke:#585858;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.9297" x="548.6318" y="186.8481">a decent teacher already exists &#8212;</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.1108" x="607.5413" y="201.981">cheap cold start</text></g><!--link H to TD--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="15" id="lnk8"><path d="M255.2018,105.8713 C213.2918,114.8713 161.3418,133.8513 134.6318,173.7813 C122.6218,191.7313 123.2176,211.2139 127.8276,230.8239" fill="none" id="H-to-TD" style="stroke:#585858;stroke-width:2;"/><polygon fill="#585858" points="128.9718,235.6912,130.8061,226.0147,127.8276,230.8239,123.0184,227.8455,128.9718,235.6912" style="stroke:#585858;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.9341" x="135.6318" y="186.8481">credit a long game to</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.7148" x="141.7415" y="201.981">intermediate states</text></g><!--link TD to Q--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="16" id="lnk9"><path d="M142.1818,304.9713 C143.8318,340.9813 146.2127,392.7365 147.8627,428.7065" fill="none" id="TD-to-Q" style="stroke:#585858;stroke-width:2;"/><polygon fill="#585858" points="148.0918,433.7013,151.6752,424.5274,147.8627,428.7065,143.6836,424.894,148.0918,433.7013" style="stroke:#585858;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link H to PG--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="17" id="lnk10"><path d="M316.5118,143.9913 C316.1518,153.8212 315.8218,164.1413 315.6318,173.7813 C314.5218,230.1713 315.9695,290.7639 317.2295,329.5539" fill="none" id="H-to-PG" style="stroke:#585858;stroke-width:2;"/><polygon fill="#585858" points="317.3918,334.5513,321.0975,325.4261,317.2295,329.5539,313.1018,325.6859,317.3918,334.5513" style="stroke:#585858;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.7837" x="316.6318" y="194.3481">stochastic or continuous actions</text></g><!--link BC to POL--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="18" id="lnk11"><path d="M515.1918,403.9412 C473.0718,446.3313 404.4258,515.4242 360.2358,559.9042" fill="none" id="BC-to-POL" style="stroke:#585858;stroke-width:2;"/><polygon fill="#585858" points="356.7118,563.4513,365.8926,559.8857,360.2358,559.9042,360.2173,554.2473,356.7118,563.4513" style="stroke:#585858;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Q t
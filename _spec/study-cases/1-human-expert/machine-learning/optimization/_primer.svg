ce-line="8" id="ent0002"><rect fill="#005F7F" filter="url(#f5q3jp0jyn2i9)" height="68.8906" rx="6" ry="6" style="stroke:#00BAC6;stroke-width:0.5;" width="190.3242" x="70.4055" y="235.7813"/><text fill="#FAFAFA" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="43.4834" x="143.8259" y="258.7764">&#171;app&#187;</text><text fill="#FAFAFA" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128.5771" x="101.2791" y="275.0732">Gradient available</text><text fill="#FAFAFA" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="170.3242" x="80.4055" y="291.3701">SGD, momentum, Adam</text></g><!--entity BB--><g class="entity" data-qualified-name="BB" data-source-line="9" id="ent0003"><rect fill="#E9F4F7" filter="url(#f5q3jp0jyn2i9)" height="68.8906" rx="6" ry="6" style="stroke:#005F7F;stroke-width:0.5;" width="168.3604" x="295.4055" y="235.7813"/><text fill="#005F7F" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="47.3525" x="355.9094" y="258.7764">&#171;host&#187;</text><text fill="#005F7F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.4619" x="338.3547" y="275.0732">No gradient</text><text fill="#005F7F" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="148.3604" x="305.4055" y="291.3701">CMA-ES, hill-climbing</text></g><!--entity THETA--><g class="entity" data-qualified-name="THETA" data-source-line="10" id="ent0004"><path d="M194.9055,391.7813 C194.9055,381.7813 272.5745,381.7813 272.5745,381.7813 C272.5745,381.7813 350.2434,381.7813 350.2434,391.7813 L350.2434,433.375 C350.2434,443.375 272.5745,443.375 272.5745,443.375 C272.5745,443.375 194.9055,443.375 194.9055,433.375 L194.9055,391.7813" fill="#E5E4E4" filter="url(#f5q3jp0jyn2i9)" style="stroke:#585858;stroke-width:0.5;"/><path d="M194.9055,391.7813 C194.9055,401.7813 272.5745,401.7813 272.5745,401.7813 C272.5745,401.7813 350.2434,401.7813 350.2434,391.7813" fill="none" style="stroke:#585858;stroke-width:0.5;"/><text fill="#181818" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="34.9043" x="255.1223" y="418.7764">&#171;db&#187;</text><text fill="#181818" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.3379" x="204.9055" y="435.0732">Parameter vector &#952;</text></g><g class="entity" data-qualified-name="GMN9" data-source-line="18" id="ent0010"><path d="M85.9055,504.7813 L85.9055,689.2422 A0,0 0 0 0 85.9055,689.2422 L459.3782,689.2422 A0,0 0 0 0 459.3782,689.2422 L459.3782,514.7813 L449.3782,504.7813 L276.4055,504.7813 L272.4055,443.8313 L268.4055,504.7813 L85.9055,504.7813 A0,0 0 0 0 85.9055,504.7813" fill="#E5E4E4" filter="url(#f5q3jp0jyn2i9)" style="stroke:#B4B3B3;stroke-width:0.5;"/><path d="M449.3782,504.7813 L449.3782,514.7813 L459.3782,514.7813 L449.3782,504.7813" fill="#E5E4E4" style="stroke:#B4B3B3;stroke-width:0.5;"/><text fill="#181818" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="336.8765" x="99.7036" y="521.8481">The dividing question is a gradient, not scale.</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.4448" x="132.4194" y="536.981">A neural net exposes &#8706;Loss/&#8706;&#952;, so it takes</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.9907" x="129.8645" y="552.1138">gradient steps (</text><text fill="#181818" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="164.3599" x="232.8552" y="552.1138">gradient-descent.puml</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="9.2041" x="397.2151" y="552.1138">).</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.7656" x="113.259" y="567.2466">A hand-tuned weight vector scored by //playing</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.4204" x="101.9316" y="582.3794">games// exposes no derivative &#8212; the objective is a</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.0757" x="117.604" y="597.5122">noisy black box, so it needs population search</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="5.0718" x="217.9573" y="612.645">(</text><text fill="#181818" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="86.0933" x="223.0291" y="612.645">cma-es.puml</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="9.2041" x="309.1223" y="612.645">).</text><line style="stroke:#B4B3B3;stroke-width:1;" x1="86.9055" x2="458.3782" y1="615.7109" y2="615.7109"/><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.7041" x="104.2898" y="631.7778">This is the seam where a heuristic evaluator stops</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.4727" x="91.9055" y="646.9106">being argued about and starts being measured: make</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.3623" x="125.9607" y="662.0435">the weights a vector, define a fitness signal</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="5.0718" x="147.8442" y="677.1763">(</text><text fill="#181818" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="140.8799" x="152.916" y="677.1763">../rating-systems/</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.6436" x="293.7959" y="677.1763">), then search.</text></g><!--link H to GRAD--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="12" id="lnk5"><path d="M205.0455,144.0213 C195.9255,152.9512 187.5755,162.9412 181.4055,173.7813 C170.7555,192.4813 167.1036,211.3634 165.7636,230.5634" fill="none" id="H-to-GRAD" style="stroke:#585858;stroke-width:2;"/><polygon fill="#585858" points="165.4155,235.5512,170.0324,226.8516,165.7636,230.5634,162.0518,226.2946,165.4155,235.5512" style="stroke:#585858;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.895" x="189.9973" y="186.8481">loss is differentiable</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.0786" x="182.4055" y="201.981">and cheap to evaluate</text></g><!--link H to BB--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="13" id="lnk6"><path d="M311.9055,143.9113 C319.4755,153.4813 327.0055,163.7213 333.4055,173.7813 C345.8555,193.3413 355.1614,212.2093 363.4714,230.9793" fill="none" id="H-to-BB" style="stroke:#585858;stroke-width:2;"/><polygon fill="#585858" points="365.4955,235.5512,365.5096,225.7024,363.4714,230.9793,358.1945,228.941,365.4955,235.5512" style="stroke:#585858;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.0112" x="361.092" y="186.8481">objective is a simulation,</text><text fill="#181818" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.3843" x="351.4055" y="201.981">a match result, or a ranking</text></g><!--link GRAD to THETA--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="14" id="lnk7"><path d="M178.7255,305.0413 C185.5155,320.1113 194.6255,337.6313 205.4055,351.7813 C213.5455,362.4613 220.0479,369.4088 230.0479,378.3488" 